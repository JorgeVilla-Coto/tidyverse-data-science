# Universo de fuentes del agente Weekly Insights.
# prioridad: alta = cuenta para el umbral de "fuentes caídas" (>=40% caídas => parada).
# Editar este archivo es la forma soportada de cambiar el alcance del agente.

ejes:
  - shopper       # comportamiento en punto de venta, path to purchase, categoría, retail media
  - consumidor    # actitudes, hábitos, segmentación, poder de compra, cultura de consumo
  - marcas        # brand equity, posicionamiento, comunicación, pricing, portafolio
  - tendencias    # señales emergentes, tecnología aplicada a consumo, macro-consumo

capas:

  academica:
    prioridad: alta
    fuentes:
      - nombre: Journal of Marketing (AMA)
        url: https://journals.sagepub.com/home/jmx
      - nombre: Journal of Marketing Research
        url: https://journals.sagepub.com/home/mrj
      - nombre: Journal of Consumer Research
        url: https://academic.oup.com/jcr
      - nombre: Journal of Retailing
        url: https://www.sciencedirect.com/journal/journal-of-retailing
      - nombre: Journal of Retailing and Consumer Services
        url: https://www.sciencedirect.com/journal/journal-of-retailing-and-consumer-services
      - nombre: Marketing Science Institute
        url: https://www.msi.org/articles/
      - nombre: SSRN - Marketing eJournals
        url: https://www.ssrn.com/index.cfm/en/marketing-research-network/
      - nombre: NBER Working Papers
        url: https://www.nber.org/papers

  industria:
    prioridad: alta
    fuentes:
      - nombre: Kantar - Insights
        url: https://www.kantar.com/inspiration
      - nombre: NIQ (NielsenIQ) - Insights
        url: https://nielseniq.com/global/en/insights/
      - nombre: Circana
        url: https://www.circana.com/intelligence/
      - nombre: Ipsos - Knowledge
        url: https://www.ipsos.com/en/knowledge
      - nombre: Euromonitor - Articles
        url: https://www.euromonitor.com/articles
      - nombre: McKinsey - Growth, Marketing & Sales
        url: https://www.mckinsey.com/capabilities/growth-marketing-and-sales/our-insights
      - nombre: Bain - Consumer Products
